<!--
  Webflow → Site settings → Custom code → FOOTER CODE (avant </body>)
  Placer APRÈS les librairies externes (GSAP, ScrollTrigger, Lenis…) :
  main.js les lit sur window.
-->
<!-- Scroll fluide (Lenis) : lu par main.js sur window.Lenis -->
<script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
<!-- Sliders (Swiper) : lu par main.js sur window.Swiper -->
<script src="https://cdn.jsdelivr.net/npm/swiper@11.1.14/swiper-bundle.min.js"></script>
<script>
  (window.__worknshare || Promise.resolve({ base: 'https://cdn.jsdelivr.net/gh/Brand-Appart-Delivery/worknshare-webflow-scripts@main' }))
    .then(function (o) {
      const script = document.createElement('script');
      script.src = o.base + '/main.js';
      document.body.appendChild(script);
      console.log("[Work'n'Share] JS :", script.src);
    });
</script>
