<!--
  Webflow → Site settings → Custom code → HEAD CODE
  Charge main.css (et prépare main.js pour le footer).

  - Production : lit version.json sur GitHub (sans cache) puis charge
    jsDelivr @<version> : nouvelle adresse à chaque deploy, jamais d'ancien
    fichier en cache. Repli sur @main si version.json ne répond pas.
  - Staging (*.webflow.io) avec FORCE_PROD = false : essaie le serveur local
    puis le tunnel (npm run dev), avec rechargement automatique.
  - Anti-flash : la page reste invisible tant que main.css n'est pas chargé
    (sinon on voit la page sans ses styles d'animation, puis elle saute).
    Sécurité : affichée quoi qu'il arrive au bout de 2,5 s.
  - Rechargement de la page : on repart toujours du haut (pas de reprise de la
    position de scroll), sauf lien vers une ancre (#section).
  - Navigation interne (on vient d'une page du site) : html.is-internal-nav,
    la nav ne rejoue pas son animation d'arrivée.
-->
<style>
  html.wns-loading body { opacity: 0; }
  html.wns-ready body { transition: opacity 0.2s ease; }
</style>
<script>
  (function () {
    const FORCE_PROD = false;

    // Rechargement : pas de reprise de la position de scroll (main.js remonte en haut)
    const navEntry = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
    if (navEntry && navEntry.type === 'reload' && !location.hash && 'scrollRestoration' in history) {
      history.scrollRestoration = 'manual';
      window.scrollTo(0, 0);
    }

    // Arrivée depuis une autre page du site (clic, retour arrière) : la nav ne
    // rejoue pas son animation d'entrée (html.is-internal-nav, _mega-menu.scss)
    const root = document.documentElement;
    try {
      const fromSite = document.referrer && new URL(document.referrer).origin === location.origin;
      if (fromSite && (!navEntry || navEntry.type !== 'reload')) root.classList.add('is-internal-nav');
    } catch (e) {}

    // Anti-flash : page cachée jusqu'à l'arrivée de main.css
    root.classList.add('wns-loading');
    let shown = false;
    function show() {
      if (shown) return;
      shown = true;
      root.classList.add('wns-ready');
      root.classList.remove('wns-loading');
    }
    setTimeout(show, 2500);

    const REPO = 'Brand-Appart-Delivery/worknshare-webflow-scripts';
    const DEV_ORIGINS = ['http://localhost:3000', 'https://dev.michelaxel.fr'];
    const VERSION_URL = 'https://raw.githubusercontent.com/' + REPO + '/main/version.json';
    const CDN = 'https://cdn.jsdelivr.net/gh/' + REPO + '@';

    const host = window.location.hostname;
    const isStaging = host === 'localhost' || host === '127.0.0.1' || host.endsWith('.webflow.io');

    function getProdVersion() {
      const ctrl = new AbortController();
      const timer = setTimeout(function () { ctrl.abort(); }, 1500);
      return fetch(VERSION_URL + '?t=' + Date.now(), { cache: 'no-store', signal: ctrl.signal })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) { return d && d.version ? d.version : 'main'; })
        .catch(function () { return 'main'; })
        .finally(function () { clearTimeout(timer); });
    }

    async function findDevOrigin() {
      if (FORCE_PROD || !isStaging) return null;
      for (const origin of DEV_ORIGINS) {
        try {
          await fetch(origin + '/main.css', { method: 'HEAD' });
          return origin;
        } catch (e) {}
      }
      return null;
    }

    window.__worknshare = (async function () {
      const dev = await findDevOrigin();
      if (dev) return { base: dev, dev: true };
      const version = await getProdVersion();
      return { base: CDN + version, version: version };
    })();

    window.__worknshare.catch(show);
    window.__worknshare.then(function (o) {
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = o.base + '/main.css';
      link.onload = link.onerror = show;
      document.head.appendChild(link);
      console.log("[Work'n'Share] CSS :", link.href);
      if (o.dev) {
        try {
          new EventSource(o.base + '/esbuild').addEventListener('change', function () {
            location.reload();
          });
        } catch (e) {}
      }
    });
  })();
</script>
